name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: billing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/billing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app migrations tests scripts
      - run: ruff format --check app migrations tests scripts
      - run: pytest -q
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build -t billing-test .
      - name: Start from the Phase 3 schema
        run: docker compose run --build --rm billing-app alembic upgrade 0003
      - run: docker compose up -d --build
      - name: Check deployed API and historical dashboard
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/v1/readiness; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/api/v1/readiness
          curl --fail http://localhost:8080/api/v1/metering/meters
          curl --fail http://localhost:8080/history
          curl --fail http://localhost:8080/costs
          curl --fail http://localhost:8080/api/v1/pricing/products
          curl --fail http://localhost:8080/api/v1/rating/quality
          curl --fail http://localhost:8080/billing-cycles
          curl --fail http://localhost:8080/invoices
          curl --fail http://localhost:8080/api/v1/billing/quality
      - name: Explicit demo pricing survives restart
        run: |
          docker compose exec -T billing-app python -m app.cli pricing seed-demo
          curl --fail --silent http://localhost:8080/api/v1/pricing/price-books > /tmp/books-before.json
          docker compose restart billing-app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/v1/readiness; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/api/v1/pricing/price-books > /tmp/books-after.json
          diff /tmp/books-before.json /tmp/books-after.json
      - if: always()
        run: docker compose down --volumes
